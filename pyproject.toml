[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sws-agent"
version = "0.1.0"
description = "Semantic Workspace Steward (SWS) - semantic governance and workspace intelligence for an individual AWS account."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Synthesis-works" }]
keywords = ["aws", "governance", "semantic", "mcp", "inventory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# Minimal foundation runtime. The core never imports boto3: the M6 real
# client factory (sws_agent.aws) imports it lazily behind the optional 'aws'
# extra. MCP wiring is implemented (M4) via the optional 'mcp' extra.
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "cryptography>=42",
]
# Optional detached-approval signing (Candidate 1, Option B): the Ed25519
# signature layer. Importing sws_agent and the approval gate never requires it
# (cryptography is imported lazily inside the signing/verification functions),
# but CI installs it via the dev extra so the signature tests actually run.
signature = [
    "cryptography>=42",
]
# Optional AWS SDK for the real client factory only. boto3 is NOT a runtime
# dependency of the collector core: the hermetic unit suite never imports it,
# and sws_agent.aws imports it lazily when a collector tool actually runs.
aws = [
    "boto3>=1.34",
]
# Optional Strands/Bedrock explanation layer (M3-A). Installed only when the
# Strands-backed ExplanationProvider is used; importing sws_agent never
# requires strands (lazy import in bedrock_explanation.build_strands_agent).
explanation = [
    "strands-agents>=1.0",
]
# Optional MCP server extras (M4): the Streamable HTTP transport server is
# built on the official MCP SDK v2 (do NOT rely on a transitively installed
# copy) plus uvicorn for explicit loopback/local serving. The hermetic test
# suite and the core never require mcp; only sws_agent.mcp.server does.
mcp = [
    "mcp>=2.1",
    "uvicorn",
]
# Optional web simulator extras (M5): a local-only interactive demo UI over
# the real M4 Streamable HTTP MCP server. starlette only serves the demo web
# app; uvicorn and the official MCP client ride the mcp extra transitively.
simulator = [
    "starlette",
    "mcp>=2.1",
    "uvicorn",
    "httpx",
]

[project.urls]
Repository = "https://github.com/Synthesis-works/Semantic-Workspace-Steward"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"